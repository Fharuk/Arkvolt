# Render blueprint for the ARKVOLT backend.
#
#   Dashboard → New → Blueprint → point at this repository.
#
# The frontend is NOT here — it belongs on Vercel (apps/web/vercel.json).
# Render only runs the Express API and the Postgres database behind it.

databases:
  - name: arkvolt-db
    databaseName: arkvolt
    user: arkvolt
    region: frankfurt
    # Free instances expire after 30 days and cannot be backed up.
    # Upgrade to at least "basic-256mb" before taking real orders.
    plan: free
    postgresMajorVersion: '17'

services:
  - type: web
    name: arkvolt-api
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    healthCheckPath: /health
    # The DB lives outside the build, so the schema is pushed in the build step.
    # `db push` is safe to re-run; switch to `prisma migrate deploy` once the
    # schema is frozen and migrations exist.
    buildCommand: npm ci && npm run db:generate && npm run build --workspace @arkvolt/shared && npm run build --workspace @arkvolt/api && npm run db:push --workspace @arkvolt/api
    startCommand: npm run start --workspace @arkvolt/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: arkvolt-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 12h
      - key: LOG_LEVEL
        value: info

      # ── Set these in the Render dashboard ──────────────────────────────
      # The exact origin the browser is on, including https:// and no
      # trailing slash. Admin mutations are rejected unless the Origin header
      # matches this list — and the browser's origin is the Vercel domain, not
      # the Render one, because Vercel proxies /api/* through to here.
      - key: CORS_ORIGINS
        sync: false

      # Used in WhatsApp routing and on the storefront.
      - key: WHATSAPP_NUMBER
        value: '2349030438653'

      # Administrator account, created on first boot if it does not exist.
      # Change the password from the dashboard after the first sign-in.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_NAME
        value: Arkvolt Admin
      - key: ADMIN_PASSWORD
        sync: false

      # Image storage. Required in production — without these the API refuses
      # uploads rather than writing to Render's ephemeral disk.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: CLOUDINARY_FOLDER
        value: arkvolt

      # No mail provider is required. Replies are sent from the operator's own
      # inbox or WhatsApp, so the dashboard generates wa.me and mailto: links
      # rather than holding SMTP credentials.
